<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.25" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="5" opacity="0.4" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.6" />

  <!-- Target crosshairs -->
  <line x1="256" y1="50" x2="256" y2="110" stroke="#10b981" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="402" x2="256" y2="462" stroke="#10b981" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="50" y1="256" x2="110" y2="256" stroke="#10b981" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <line x1="402" y1="256" x2="462" y2="256" stroke="#10b981" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- Lightning Bolt for Flash Deals / Glitches -->
  <path d="M280 80 L160 270 L250 270 L220 432 L360 230 L275 230 Z" fill="url(#boltGrad)" filter="url(#glow)" />
  <path d="M276 96 L175 258 L254 258 L228 406 L342 242 L271 242 Z" fill="#ffffff" opacity="0.65" />

  <!-- Badge / Price Tag dot -->
  <circle cx="360" cy="140" r="18" fill="#10b981" filter="url(#glow)" />
  <text x="360" y="146" text-anchor="middle" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" font-weight="900">%</text>
</svg>
